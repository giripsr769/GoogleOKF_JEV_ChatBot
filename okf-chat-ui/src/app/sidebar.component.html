<aside class="sidebar" [class.collapsed]="!store.sidebarOpen()" aria-label="Sidebar">
  <div class="top">
    <button
      class="icon-btn"
      (click)="store.toggleSidebar()"
      [attr.aria-label]="store.sidebarOpen() ? 'Collapse sidebar' : 'Expand sidebar'"
      [attr.aria-expanded]="store.sidebarOpen()"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    @if (store.sidebarOpen()) {
      <span class="brand">OKF Chat</span>
    }
  </div>

  <button class="new-chat" (click)="newChat()" title="New chat" aria-label="New chat">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14" />
    </svg>
    @if (store.sidebarOpen()) {
      <span>New chat</span>
    }
  </button>

  @if (store.sidebarOpen()) {
    <nav class="history" aria-label="Chat history">
      @for (g of store.groups(); track g.label) {
        <p class="group">{{ g.label }}</p>
        @for (c of g.chats; track c.id) {
          <div class="item" [class.active]="c.id === store.activeId()">
            <button class="item-main" (click)="open(c.id)" [attr.aria-current]="c.id === store.activeId() ? 'true' : null" [title]="c.title">
              {{ c.title }}
            </button>
            <button class="del" (click)="store.remove(c.id)" [attr.aria-label]="'Delete chat: ' + c.title" title="Delete chat">×</button>
          </div>
        }
      } @empty {
        <p class="empty">No chats yet. Ask a question to start one.</p>
      }
    </nav>

    <section class="settings" aria-label="Settings">
      <p class="group">Settings</p>
      <label class="row">
        <span>Show SQL query</span>
        <input type="checkbox" role="switch" class="switch" [checked]="store.showSql()" (change)="onSqlToggle($event)" />
      </label>
      <button class="clear" (click)="clearAll()" [disabled]="!store.chats().length" [class.armed]="confirmClear()">
        {{ confirmClear() ? 'Click again to confirm' : 'Clear all history' }}
      </button>
    </section>
  } @else {
    <div class="spacer"></div>
    <button
      class="icon-btn sql-rail"
      (click)="store.setShowSql(!store.showSql())"
      [attr.aria-pressed]="store.showSql()"
      [class.on]="store.showSql()"
      title="Show SQL query"
      aria-label="Show SQL query"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 7l-5 5 5 5M16 7l5 5-5 5" />
      </svg>
    </button>
  }
</aside>
<div class="backdrop" [class.show]="store.sidebarOpen()" (click)="store.toggleSidebar()"></div>
